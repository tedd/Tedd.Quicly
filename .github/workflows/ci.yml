name: CI

# Cost control (GitHub bills Windows minutes at twice the Linux rate):
#   * docs, the site and markdown never affect the build, so they do not start one;
#   * a newer push cancels the run it superseded instead of paying for both;
#   * one target framework, not both — net10.0 catches essentially every real regression,
#     and both frameworks are still run locally before anything is released;
#   * an explicit timeout, because a hung run would otherwise bill GitHub's 6-hour default.
# The real gate is the local per-project run (docs/DEVELOPMENT.md); this is the safety net.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - docs/**
      - site/**
      - LICENSE
  pull_request:
    paths-ignore:
      - '**.md'
      - docs/**
      - site/**
      - LICENSE

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Build
        run: dotnet build Tedd.Quicly.slnx -c Release

      # One framework. A per-project loop rather than the whole solution at once, because a
      # solution-wide run shares ports, the machine certificate store and HttpListener prefixes
      # between assemblies and fails a rotating handful of real-network tests for that reason
      # alone (see the memory of full-solution flakiness in docs/DEVELOPMENT.md).
      - name: Test
        run: dotnet test Tedd.Quicly.slnx -c Release --no-build -f net10.0
