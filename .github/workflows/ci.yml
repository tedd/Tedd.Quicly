name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview
      - name: Build
        run: dotnet build Tedd.Quicly.slnx -c Release
      - name: Test
        run: dotnet test Tedd.Quicly.slnx -c Release --no-build
