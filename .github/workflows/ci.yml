name: CI

# What runs here is a safety net, not the gate. The gate is the local per-project run before a push
# (docs/DEVELOPMENT.md): a full-solution run shares ports, the machine certificate store and HttpListener
# prefixes between assemblies and fails a rotating handful of real-network tests for that reason alone, so
# the suites worth trusting are the ones run one project at a time — which is a thing to do on a developer's
# machine, not on a billed runner.
#
# Cost control (GitHub bills Windows minutes at twice the Linux rate):
#   * docs, the site and markdown never affect the build, so they do not start one;
#   * a newer push cancels the run it superseded instead of paying for both;
#   * one target framework — net10.0 catches essentially every real regression, and both are run locally;
#   * only the fast, deterministic, no-network suites. Core (~95 s), Transport.MsQuic, EndToEnd, Client,
#     Server, Http and Replication bind sockets, build certificates and drive real MsQuic; they are the
#     slow and flaky ones, and they run locally before a push;
#   * an explicit timeout, because a hung run would otherwise bill GitHub's 6-hour default.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - docs/**
      - site/**
      - LICENSE
  pull_request:
    paths-ignore:
      - '**.md'
      - docs/**
      - site/**
      - LICENSE
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview

      # The build is most of the value: it compiles every project and every test project on both target
      # frameworks, so an API break or a bad merge fails here whatever the test selection is.
      - name: Build
        run: dotnet build Tedd.Quicly.slnx -c Release

      # About 25 seconds of tests. Never pass --artifacts-path to Http3.Tests: two of its tests find the
      # repository root by walking up for Tedd.Quicly.slnx and a redirected path fails them.
      - name: Test (fast suites)
        run: |
          dotnet test tests/Tedd.Quicly.Http3.Tests/Tedd.Quicly.Http3.Tests.csproj -c Release --no-build -f net10.0
          dotnet test tests/Tedd.Quicly.Testing.Tests/Tedd.Quicly.Testing.Tests.csproj -c Release --no-build -f net10.0
          dotnet test tests/Tedd.Quicly.Acme.Tests/Tedd.Quicly.Acme.Tests.csproj -c Release --no-build -f net10.0
